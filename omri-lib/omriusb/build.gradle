apply plugin: 'com.android.library'

android {
    namespace 'org.omri'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    buildTypes {
        release {
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    cppFlags -= "-DDEBUGOUTPUT"
                }
            }
        }
        debug {
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    cppFlags += "-DDEBUGOUTPUT"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.annotation:annotation:1.7.1'
    // Dead deps removed (see CLAUDE.md port plan):
    //   de.irt.hradio:dabaudiodecoderplugininterface -> local AIDL under src/main/aidl
    //   eu.hradio.core:radiodns / platformsearch      -> IP/RadioDNS parts stripped
    //   com.google.android.exoplayer:exoplayer-core   -> IP streaming stripped
}
